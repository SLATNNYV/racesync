# Spring Boot Application Properties

spring.application.name=racesync-backend
server.port=8080

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:racesyncdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console Configuration (for easy local database viewing)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA/Hibernate configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configurations
# Secret key should be a 256-bit (32 bytes) hex or base64-encoded key for production.
# For local dev, we use a simple secret string.
racesync.jwt.secret=9a76a982ba384c4fae9b3d1b6cf42194cf2194a2b9631623910c5bc6b5c00e12
# Expiration: 24 hours (in milliseconds)
racesync.jwt.expiration-ms=86400000
